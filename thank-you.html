<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent - YMR ShipChandlers</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <style>
        .thank-you-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .success-icon {
            font-size: 5rem;
            color: var(--accent-red);
            margin-bottom: 2rem;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="maritime-bg">
        <div class="waves-container">
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>
        </div>
        <div class="floating-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- Navigation (Simplified for success page) -->
    <nav class="navbar navbar-expand-lg fixed-top maritime-nav">
        <div class="container">
            <a href="index.html" class="navbar-brand maritime-logo">
                <img src="image/ymr-logo.png" alt="YMR ShipChandlers Logo" class="logo-image">
                <span class="logo-text">YMR ShipChandlers</span>
            </a>
        </div>
    </nav>

    <div class="thank-you-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="success-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h1 class="hero-title">Message Received</h1>
                    <p class="lead mb-5" style="color: rgba(0, 0, 0, 0.8)">Thank you for contacting YMR
                        ShipChandlers. We have received your inquiry and our team will get back to you shortly at
                        <strong>ymrshipchandlers@gmail.com</strong>.
                    </p>
                    <a href="index.html" class="btn btn-maritime btn-lg">
                        <i class="fas fa-home me-2"></i> Return to Homepage
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-maritime">
        <div class="container text-center">
            <p>&copy; 2024 YMR ShipChandlers. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
